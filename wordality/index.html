<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordality</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Header -->
        <header id="header">
            <h1 id="title">WORDALITY</h1>
            <div id="subtitle">Wordle meets Spelling Bee</div>
        </header>

        <!-- Wordle Phase -->
        <div id="wordle-phase" class="phase active">
            <div id="wordle-info">
                <span id="guess-counter">Guess 1 of 10</span>
            </div>
            <div id="wordle-board"></div>
            <div id="wordle-message"></div>
            <div id="keyboard"></div>
        </div>

        <!-- Transition Phase -->
        <div id="transition-phase" class="phase">
            <div id="transition-content">
                <div id="transition-icon">&#10003;</div>
                <h2 id="transition-title"></h2>
                <p id="transition-word-reveal"></p>
                <p id="transition-subtitle">Those 7 letters are now your Spelling Bee!</p>
                <div id="transition-letters"></div>
                <button id="start-bee-btn" class="btn-primary">Start Spelling Bee</button>
            </div>
        </div>

        <!-- Spelling Bee Phase -->
        <div id="bee-phase" class="phase">
            <div id="bee-header">
                <div id="score-display">
                    <span id="score-label">Score</span>
                    <span id="score">0</span>
                </div>
                <div id="timer-wrapper">
                    <div id="timer-container">
                        <div id="timer-bar"></div>
                    </div>
                    <div id="timer-info">
                        <span id="timer-text">10s</span>
                        <span id="rotation-text">Letter 1/7</span>
                    </div>
                </div>
                <div id="words-found-display">
                    <span id="words-found-label">Words</span>
                    <span id="words-found-count">0</span>
                </div>
            </div>

            <div id="bee-current-word"></div>
            <div id="bee-message"></div>

            <div id="honeycomb-container">
                <div id="honeycomb">
                    <!-- Hexagons generated by JS -->
                </div>
            </div>

            <div id="bee-controls">
                <button id="delete-bee-btn" class="btn-secondary">Delete</button>
                <button id="shuffle-btn" class="btn-secondary">Shuffle</button>
                <button id="submit-bee-btn" class="btn-primary">Enter</button>
            </div>

            <div id="found-words-container">
                <div id="found-words-header">
                    <h3>Found Words</h3>
                    <span id="found-words-total"></span>
                </div>
                <div id="found-words-list"></div>
            </div>
        </div>

        <!-- End Phase -->
        <div id="end-phase" class="phase">
            <div id="end-content">
                <h2 id="end-title">Game Over!</h2>
                <div id="end-stats">
                    <div class="stat-card">
                        <div class="stat-value" id="stat-wordle-guesses">-</div>
                        <div class="stat-label">Wordle Guesses</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-bee-score">-</div>
                        <div class="stat-label">Bee Score</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-words-found">-</div>
                        <div class="stat-label">Words Found</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-pangrams">-</div>
                        <div class="stat-label">Pangrams</div>
                    </div>
                </div>
                <div id="end-word-list">
                    <h3>Words You Found</h3>
                    <div id="end-found-words"></div>
                </div>
                <div id="end-missed">
                    <h3>Words You Missed</h3>
                    <div id="end-missed-words"></div>
                </div>
                <button id="play-again-btn" class="btn-primary">Play Again</button>
            </div>
        </div>
    </div>

    <script src="words.js"></script>
    <script src="game.js"></script>
</body>
</html>
